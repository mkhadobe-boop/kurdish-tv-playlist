<style>
:root{--ink:#23332c;--gold:#b88b46;--gold-light:#f3dca2;--gold-dark:#7a592a;--cream:#fffaf0;--shadow:0 24px 90px #0005}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;min-height:100svh;color:var(--ink);font-family:'Noto Kufi Arabic','Geeza Pro',sans-serif;background:radial-gradient(ellipse at 50% -10%,#506354 0%,#24382f 44%,#101d19 100%);overflow-x:hidden}
body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.19;background-image:radial-gradient(circle at 20% 30%,#fff3 0 1px,transparent 1.3px),radial-gradient(circle at 60% 60%,#fff3 0 1px,transparent 1.3px);background-size:39px 47px,73px 77px}
main{min-height:100svh;display:grid;place-items:center;padding:26px 14px 46px;position:relative}

.card{width:min(100%,468px);min-height:840px;position:relative;isolation:isolate;overflow:hidden;border-radius:170px 170px 18px 18px / 90px 90px 18px 18px;background:radial-gradient(ellipse at 46% 34%,#fffef9 8%,#fdf7e8 62%,#f0e4ca 100%);box-shadow:0 0 0 1px #e3bb74aa,0 0 0 7px #fff8e618,0 30px 96px #0007;transform-origin:50% 10%;}
.card:before{content:"";position:absolute;inset:0;z-index:-1;background-image:repeating-linear-gradient(128deg,#caa36908 0px,#caa36908 2px,transparent 2px,transparent 9px),radial-gradient(circle at 18% 43%,#dabc8420 0,transparent 25%),radial-gradient(circle at 95% 75%,#dabc8420 0,transparent 27%)}
.card:after{content:"";position:absolute;inset:16px;z-index:-1;border:1px solid #ca9c53aa;border-radius:160px 160px 10px 10px/80px 80px 10px 10px;pointer-events:none}

.card-contents{position:relative;z-index:3;min-height:840px;display:flex;flex-direction:column;align-items:center;text-align:center;padding:102px 28px 40px}
.top-design{position:absolute;z-index:2;top:13px;left:50%;transform:translateX(-50%);width:125px;height:80px;opacity:.9;pointer-events:none}
.corner-art{position:absolute;z-index:1;pointer-events:none;width:220px;height:255px;filter:drop-shadow(0 4px 5px #aa8c5a13)}
.corner-art.top{top:-28px;left:-51px;animation:sway 9s ease-in-out infinite;transform-origin:20% 5%}
.corner-art.bottom{bottom:-60px;right:-72px;transform:rotate(180deg);animation:swayback 11s ease-in-out infinite;transform-origin:80% 90%}
.leaf-spray{position:absolute;top:25%;right:-48px;width:105px;opacity:.27;transform:rotate(175deg)}
.leaf-spray.other{top:55%;left:-45px;right:auto;transform:rotate(-10deg)}
.bismillah{font-family:'Amiri','Noto Naskh Arabic',serif;font-size:clamp(25px,6.5vw,32px);line-height:1.8;white-space:nowrap;color:#483a29;margin:0 0 5px;text-shadow:0 1px 1px #fff}
.separator{display:flex;align-items:center;gap:12px;margin:6px auto 29px;color:var(--gold);width:64%;font-size:18px}
.separator:before,.separator:after{content:"";height:1px;flex:1;background:linear-gradient(to left,transparent,#bd924c 35%,#bd924c 65%,transparent)}
.greeting{font-size:clamp(22px,5.7vw,30px);font-weight:800;line-height:2;color:#27372c;margin:0}
.message{font-weight:600;font-size:clamp(16px,4.3vw,20px);line-height:2.2;margin:19px 0 28px;color:#35443a;white-space:nowrap}

.name-ornament{height:2px;max-width:162px;margin:4px auto 13px;background:linear-gradient(90deg,transparent,#b38842,transparent)}

.ring{position:absolute;top:13px;width:60px;height:37px;border:6px solid #c99b46;box-shadow:inset 0 1px 3px #8a612a,0 3px 4px #98703a44,0 0 0 2px #f7dc99;border-radius:50%;transform:rotate(-22deg);background:linear-gradient(125deg,transparent,#f7e4ae1c)}
.ring.one{right:70px}.ring.two{left:70px;transform:rotate(22deg)}

.sparkle.s1{top:0;right:20px}.sparkle.s2{top:-6px;left:17px;font-size:15px}.sparkle.s3{bottom:5px;left:63px;font-size:14px}
.bottom-text{margin-top:auto}
.venue{font-size:clamp(15px,3.7vw,18px);font-weight:600;margin:0 0 14px;color:#344438}
.date{direction:ltr;display:inline-block;border:1px solid #d5ad62;border-radius:4px;padding:7px 23px 8px;font:700 28px/1.45 'Noto Kufi Arabic',sans-serif;color:#58452d;background:#fff9e7bd;box-shadow:0 0 0 4px #f6ead1,0 4px 14px #91753c18;letter-spacing:.5px}

.petals{position:absolute;inset:0;z-index:5;pointer-events:none;overflow:hidden}
.petal{position:absolute;top:-40px;width:10px;height:17px;border-radius:90% 0 90% 0;background:linear-gradient(135deg,#fcf1d7,#cb9d54);opacity:.82;box-shadow:0 1px 5px #a88f5a22;animation:petal-fall linear infinite;animation-play-state:paused}
.open .petal{animation-play-state:running}
.petal:nth-child(1){left:9%;animation-duration:9s;animation-delay:-2s;--drift:40px}.petal:nth-child(2){left:28%;animation-duration:11s;animation-delay:-7s;--drift:-46px;transform:scale(.7)}.petal:nth-child(3){left:67%;animation-duration:12s;animation-delay:-4s;--drift:38px}.petal:nth-child(4){left:93%;animation-duration:8s;animation-delay:-6s;--drift:-26px;transform:scale(.6)}.petal:nth-child(5){left:54%;animation-duration:13s;animation-delay:-10s;--drift:-54px}.petal:nth-child(6){left:15%;animation-duration:12s;animation-delay:-10s;--drift:30px;transform:scale(.7)}.petal:nth-child(7){left:74%;animation-duration:10s;animation-delay:-1s;--drift:39px}.petal:nth-child(8){left:40%;animation-duration:14s;animation-delay:-5s;--drift:-21px;transform:scale(.6)}
.starfield{position:absolute;inset:0;pointer-events:none;z-index:4}
.star{position:absolute;width:4px;height:4px;background:#c79b4d;border-radius:50%;box-shadow:0 0 10px 3px #ffeaad77;animation:twinkle 3.1s ease-in-out infinite;opacity:0}
.star:nth-child(1){top:19%;left:12%;animation-delay:.3s}.star:nth-child(2){top:37%;right:11%;animation-delay:1.5s}.star:nth-child(3){top:55%;left:15%;animation-delay:2s}.star:nth-child(4){top:71%;right:16%;animation-delay:.8s}.star:nth-child(5){top:89%;left:22%;animation-delay:2.4s}.star:nth-child(6){top:12%;right:19%;animation-delay:1s}
/* Opening animation: staggered, calm, and readable */
.card{opacity:0;transform:translateY(35px) scale(.94);filter:blur(8px);transition:opacity 1.3s ease,transform 1.3s cubic-bezier(.16,1,.3,1),filter 1.3s ease}
.card.open{opacity:1;transform:translateY(0) scale(1);filter:blur(0)}
.reveal{opacity:0;transform:translateY(22px);transition:opacity .9s ease,transform .9s cubic-bezier(.2,.65,.1,1)}
.open .reveal{opacity:1;transform:translateY(0)}
.open .r1{transition-delay:.35s}.open .r2{transition-delay:.8s}.open .r3{transition-delay:1.35s}.open .r4{transition-delay:1.8s}.open .r5{transition-delay:2.1s}.open .r6{transition-delay:2.45s}
.open .ring.one{animation:ring-join-a 2.4s ease-in-out 2.8s both}
.open .ring.two{animation:ring-join-b 2.4s ease-in-out 2.8s both}
.open .rings-scene{animation:glowring 4s ease-in-out 4.3s infinite}
@keyframes ring-join-a{0%{translate:-38px 10px;opacity:0}55%{translate:9px 0;opacity:1}100%{translate:0 0;opacity:1}}
@keyframes ring-join-b{0%{translate:38px 10px;opacity:0}55%{translate:-9px 0;opacity:1}100%{translate:0 0;opacity:1}}

@keyframes twinkle{0%,100%{opacity:0;scale:.3}50%{opacity:1;scale:1.2}}
@keyframes sway{0%,100%{rotate:0deg}50%{rotate:2.4deg}}

.controls{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:28px;opacity:0;transform:translateY(10px);transition:opacity .7s ease 3.8s,transform .7s ease 3.8s}

.action{font-family:inherit;font-size:12px;font-weight:600;cursor:pointer;color:#ffedc8;background:#ffffff14;border:1px solid #cdb17b72;padding:10px 17px;border-radius:999px;backdrop-filter:blur(5px);transition:background .2s,transform .2s}

.envelope-icon:before{content:"";position:absolute;left:-4px;top:-92px;border-left:108px solid transparent;border-right:108px solid transparent;border-top:95px solid #f4deae;filter:drop-shadow(0 2px 1px #997445);transform:rotate(180deg);transform-origin:50% 95px}

.envelope-title{font-size:22px;font-weight:700;margin:0 0 8px}.envelope-tip{font-size:13px;opacity:.77;margin:0 0 22px}
.open-button{border:1px solid #d8af67;background:linear-gradient(120deg,#e6c58c,#b78b46);font-family:inherit;color:#21382d;box-shadow:0 5px 25px #0003;padding:11px 23px;border-radius:30px;font-weight:700;cursor:pointer;font-size:14px;transition:transform .2s}.open-button:hover{transform:translateY(-3px)}
@keyframes float-in{from{opacity:0;translate:0 22px}to{opacity:1;translate:0 0}}
@media(max-width:425px){main{padding:13px 10px 30px}.card{min-height:795px;border-radius:130px 130px 14px 14px/78px 78px 14px 14px}.card:after{inset:13px;border-radius:121px 121px 8px 8px/67px 67px 8px 8px}.inner-line{inset:18px;border-radius:113px 113px 5px 5px/60px 60px 5px 5px}.card-contents{min-height:795px;padding:94px 13px 39px}.corner-art{width:185px;height:218px}.corner-art.top{left:-49px;top:-24px}.corner-art.bottom{right:-65px;bottom:-42px}.separator{margin-bottom:24px}.greeting{font-size:clamp(20px,5.8vw,26px)}.message{font-size:clamp(13px,3.85vw,17px)}.name{font-size:38px}.name-label{font-size:17px}.date{font-size:24px}}

@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}.reveal{opacity:1;transform:none}.card{opacity:1;transform:none;filter:none}.petals{display:none}}
</style>

<script>
(() => {
  const card = document.querySelector('#card');
  const opening = document.querySelector('#opening');
  const controls = document.querySelector('#controls');
  let begun = false;
  function openInvitation(){
    if (begun) return;
    begun = true;
    opening.classList.add('dismissed');
    card.classList.add('open');
    controls.classList.add('visible');
    document.body.classList.add('invited');
  }
  document.querySelector('#openButton').addEventListener('click', e => {e.stopPropagation();openInvitation()});
  opening.addEventListener('click', openInvitation);
  opening.addEventListener('keydown', e => {if(e.key==='Enter'||e.key===' '){e.preventDefault();openInvitation()}});
  document.querySelector('#replay').addEventListener('click', () => {
    card.classList.remove('open');
    controls.classList.remove('visible');
    void card.offsetWidth;
    card.classList.add('open');
    controls.classList.add('visible');
    window.scrollTo({top:0,behavior:'smooth'});
  });
  document.querySelector('#share').addEventListener('click', async () => {
    const title='بانگهێشتنامەی مارەبڕین | لانە و ئۆمێد';
    const url=location.href;
    if(navigator.share && /^https?:$/.test(location.protocol)) {
      try { await navigator.share({title, text:'6/11/2026', url}); } catch(err) { if(err.name!=='AbortError') console.warn(err); }
    } else if (navigator.clipboard && /^https?:$/.test(location.protocol)) {
      try {await navigator.clipboard.writeText(url);alert('لینکەکە کۆپی کرا');}catch(err){alert('دەتوانیت لینکەکە لە وێبگەڕەکە کۆپی بکەیت');}
    } else {alert('دوای بڵاوکردنەوەی فایلی HTML لەسەر وێبسایت، دەتوانیت لینکەکە هاوبەش بکەیت.');}
  });
  // Open automatically after a short introduction, while still permitting tap-to-open.
  setTimeout(openInvitation, 2400);
})();
